  <text x="380" y="246" font-family="monospace" font-size="7" fill="#22c55e">CREDIT</text>
  <text x="470" y="246" font-family="monospace" font-size="8" fill="#22c55e">+85,000</text>
  <rect x="528" y="237" width="44" height="13" rx="6" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.6"/>
  <text x="550" y="247" font-family="monospace" font-size="6.5" fill="#22c55e" text-anchor="middle">SUCCESS</text>
  <line x1="20" y1="256" x2="580" y2="256" stroke="#1a2e08" stroke-width="0.6"/>
  <text x="36" y="272" font-family="monospace" font-size="7.5" fill="#94a6c2">22 Nov</text>
