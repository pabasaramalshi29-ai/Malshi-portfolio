  <text x="380" y="272" font-family="monospace" font-size="7" fill="#f43f8e">DEBIT</text>
  <text x="470" y="272" font-family="monospace" font-size="8" fill="#f43f8e">-12,400</text>
  <rect x="528" y="263" width="44" height="13" rx="6" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.6"/>
  <text x="550" y="273" font-family="monospace" font-size="6.5" fill="#22c55e" text-anchor="middle">SUCCESS</text>
  <line x1="20" y1="282" x2="580" y2="282" stroke="#1a2e08" stroke-width="0.6"/>
  <text x="36" y="298" font-family="monospace" font-size="7.5" fill="#94a6c2">20 Nov</text>
  <text x="120" y="298" font-family="sans-serif" font-size="8.5" fill="#e8edf5">ATM Withdrawal</text>
  <text x="380" y="298" font-family="monospace" font-size="7" fill="#f43f8e">DEBIT</text>
  <text x="470" y="298" font-family="monospace" font-size="8" fill="#f43f8e">-5,000</text>
  <rect x="528" y="289" width="44" height="13" rx="6" fill="#22c55e" opacity="0.15" stroke="#22c55e" stroke-width="0.6"/>
  <text x="550" y="299" font-family="monospace" font-size="6.5" fill="#22c55e" text-anchor="middle">SUCCESS</text>
