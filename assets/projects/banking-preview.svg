<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a1200"/>
      <stop offset="100%" style="stop-color:#141e00"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- top nav bar -->
  <rect x="0" y="0" width="600" height="48" fill="#08100a"/>
  <rect x="0" y="47" width="600" height="1" fill="#1a2e08"/>
  <text x="24" y="30" font-family="monospace" font-size="12" fill="#86efac" font-weight="bold" letter-spacing="2">DIGITAL BANKING</text>
  <text x="400" y="20" font-family="monospace" font-size="7.5" fill="#4a7a30" letter-spacing="1.5">DASHBOARD</text>
  <text x="460" y="20" font-family="monospace" font-size="7.5" fill="#4a7a30" letter-spacing="1.5">ACCOUNTS</text>
