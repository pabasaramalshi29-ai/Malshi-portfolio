<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#041325"/>
      <stop offset="100%" style="stop-color:#072744"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:0.3"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </radialGradient>
    <pattern id="dots" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#0ff4c6" opacity="0.18"/>
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <rect width="600" height="340" fill="url(#dots)"/>
  <rect width="600" height="340" fill="url(#glow)"/>
  <!-- browser chrome -->
  <rect x="60" y="30" width="480" height="280" rx="10" fill="#030e1f" stroke="#1c2b45" stroke-width="1.5"/>
  <rect x="60" y="30" width="480" height="32" rx="10" fill="#071a30"/>
  <rect x="60" y="50" width="480" height="12" fill="#071a30"/>
  <circle cx="82" cy="46" r="5" fill="#f43f8e" opacity="0.7"/>
  <circle cx="98" cy="46" r="5" fill="#fbbf24" opacity="0.7"/>
  <circle cx="114" cy="46" r="5" fill="#0ff4c6" opacity="0.7"/>
  <rect x="140" y="38" width="280" height="16" rx="8" fill="#0c1b2e" stroke="#1c2b45" stroke-width="1"/>
  <text x="175" y="50" font-family="monospace" font-size="9" fill="#6b7fa0">hyperlocal-weather...vercel.app</text>
  <!-- map background -->
  <rect x="68" y="62" width="464" height="240" fill="#051826"/>
  <!-- map grid lines -->
  <line x1="68" y1="100" x2="532" y2="100" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="68" y1="140" x2="532" y2="140" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="68" y1="180" x2="532" y2="180" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="68" y1="220" x2="532" y2="220" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="140" y1="62" x2="140" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="210" y1="62" x2="210" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="280" y1="62" x2="280" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="350" y1="62" x2="350" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="420" y1="62" x2="420" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <line x1="490" y1="62" x2="490" y2="302" stroke="#0d2a44" stroke-width="0.8"/>
  <!-- map roads -->
  <path d="M68,160 Q200,140 350,165 Q450,180 532,155" stroke="#0d2a44" stroke-width="3" fill="none"/>
  <path d="M68,220 Q180,200 300,215 Q420,230 532,205" stroke="#0d2a44" stroke-width="2" fill="none"/>
  <path d="M200,62 Q210,150 215,302" stroke="#0d2a44" stroke-width="2.5" fill="none"/>
  <path d="M350,62 Q345,160 348,302" stroke="#0d2a44" stroke-width="2.5" fill="none"/>
  <!-- alert zones -->
  <circle cx="230" cy="155" r="40" fill="#f43f8e" opacity="0.1" stroke="#f43f8e" stroke-width="1" stroke-dasharray="4,3"/>
  <circle cx="380" cy="175" r="28" fill="#fbbf24" opacity="0.12" stroke="#fbbf24" stroke-width="1" stroke-dasharray="3,2"/>
  <!-- markers -->
  <circle cx="230" cy="155" r="8" fill="#f43f8e" opacity="0.9"/>
  <line x1="230" y1="147" x2="230" y2="130" stroke="#f43f8e" stroke-width="1.5"/>
  <rect x="210" y="118" width="40" height="14" rx="3" fill="#0c1220" stroke="#f43f8e" stroke-width="1"/>
  <text x="230" y="128" font-family="monospace" font-size="7" fill="#f43f8e" text-anchor="middle">HIGH RISK</text>
  <circle cx="380" cy="175" r="6" fill="#fbbf24" opacity="0.9"/>
  <line x1="380" y1="169" x2="380" y2="154" stroke="#fbbf24" stroke-width="1.5"/>
  <rect x="360" y="142" width="40" height="14" rx="3" fill="#0c1220" stroke="#fbbf24" stroke-width="1"/>
  <text x="380" y="152" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">MODERATE</text>
  <circle cx="150" cy="200" r="5" fill="#0ff4c6" opacity="0.9"/>
  <circle cx="460" cy="140" r="5" fill="#0ff4c6" opacity="0.9"/>
  <!-- ui overlay panel -->
  <rect x="68" y="62" width="130" height="240" fill="#030e1f" opacity="0.92"/>
  <text x="84" y="84" font-family="monospace" font-size="8" fill="#0ff4c6" font-weight="bold">LIVE ALERTS</text>
  <line x1="78" y1="90" x2="192" y2="90" stroke="#1c2b45" stroke-width="0.8"/>
  <rect x="78" y="96" width="12" height="12" rx="2" fill="#f43f8e" opacity="0.8"/>
  <text x="97" y="105" font-family="monospace" font-size="7.5" fill="#e8edf5">Flash Flood</text>
  <text x="97" y="114" font-family="monospace" font-size="6.5" fill="#6b7fa0">2 min ago</text>
  <rect x="78" y="122" width="12" height="12" rx="2" fill="#fbbf24" opacity="0.8"/>
  <text x="97" y="131" font-family="monospace" font-size="7.5" fill="#e8edf5">Wind Storm</text>
  <text x="97" y="140" font-family="monospace" font-size="6.5" fill="#6b7fa0">15 min ago</text>
  <rect x="78" y="148" width="12" height="12" rx="2" fill="#3b82f6" opacity="0.8"/>
  <text x="97" y="157" font-family="monospace" font-size="7.5" fill="#e8edf5">Heavy Rain</text>
  <text x="97" y="166" font-family="monospace" font-size="6.5" fill="#6b7fa0">32 min ago</text>
  <!-- weather stats -->
  <text x="78" y="195" font-family="monospace" font-size="7" fill="#6b7fa0">TEMPERATURE</text>
  <text x="78" y="210" font-family="sans-serif" font-size="20" fill="#0ff4c6" font-weight="bold">28°C</text>
  <text x="78" y="230" font-family="monospace" font-size="7" fill="#6b7fa0">HUMIDITY</text>
  <text x="78" y="244" font-family="sans-serif" font-size="16" fill="#3b82f6" font-weight="bold">78%</text>
  <text x="78" y="264" font-family="monospace" font-size="7" fill="#6b7fa0">WIND SPEED</text>
  <text x="78" y="278" font-family="sans-serif" font-size="16" fill="#fbbf24" font-weight="bold">42 km/h</text>
  <!-- live badge -->
  <rect x="378" y="68" width="58" height="18" rx="9" fill="#030e1f" stroke="#f43f8e" stroke-width="1"/>
  <circle cx="389" cy="77" r="3" fill="#f43f8e"><animate attributeName="opacity" values="1;0.3;1" dur="1.5s" repeatCount="indefinite"/></circle>
  <text x="395" y="81" font-family="monospace" font-size="7.5" fill="#f43f8e" font-weight="bold">LIVE</text>
</svg>
