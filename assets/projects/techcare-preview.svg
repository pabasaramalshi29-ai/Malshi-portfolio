<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#020c1a"/>
      <stop offset="100%" style="stop-color:#051826"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg)"/>
  <!-- sidebar -->
  <rect x="0" y="0" width="156" height="340" fill="#030e1d"/>
  <rect x="156" y="0" width="1" height="340" fill="#0d2340"/>
  <!-- logo -->
  <rect x="16" y="16" width="30" height="30" rx="8" fill="#3b82f6" opacity="0.9"/>
  <text x="31" y="36" font-family="sans-serif" font-size="14" fill="white" text-anchor="middle">+</text>
  <text x="55" y="27" font-family="sans-serif" font-size="11" fill="#e8edf5" font-weight="bold">Tech</text>
  <text x="55" y="40" font-family="monospace" font-size="8" fill="#3b82f6">Care</text>
  <line x1="16" y1="56" x2="140" y2="56" stroke="#0d2340" stroke-width="0.8"/>
  <!-- nav menu items -->
  <rect x="10" y="64" width="136" height="24" rx="6" fill="#3b82f6" opacity="0.2"/>
  <text x="22" y="80" font-family="sans-serif" font-size="8.5" fill="#3b82f6">🏠 Dashboard</text>
  <text x="22" y="104" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">👤 Patients</text>
  <text x="22" y="124" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">📅 Appointments</text>
  <text x="22" y="144" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">💊 Prescriptions</text>
  <text x="22" y="164" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">🧪 Lab Results</text>
  <text x="22" y="184" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">💳 Billing</text>
  <text x="22" y="204" font-family="sans-serif" font-size="8.5" fill="#6b7fa0">⚙️ Settings</text>
  <!-- doctor profile -->
  <circle cx="78" cy="285" r="22" fill="#051826" stroke="#0d2340" stroke-width="1"/>
  <circle cx="78" cy="278" r="10" fill="#0d2340"/>
  <ellipse cx="78" cy="300" rx="14" ry="8" fill="#0d2340"/>
  <text x="78" y="315" font-family="monospace" font-size="6.5" fill="#3b82f6" text-anchor="middle">Dr. M. Perera</text>
  <!-- main area top bar -->
  <rect x="157" y="0" width="443" height="44" fill="#030e1d"/>
  <rect x="157" y="43" width="443" height="1" fill="#0d2340"/>
  <text x="175" y="27" font-family="sans-serif" font-size="12" fill="#e8edf5" font-weight="600">Patient Dashboard</text>
  <rect x="430" y="11" width="80" height="22" rx="11" fill="#3b82f6"/>
  <text x="470" y="25" font-family="monospace" font-size="7.5" fill="white" text-anchor="middle">+ New Patient</text>
  <circle cx="540" cy="22" r="12" fill="#051826" stroke="#0d2340" stroke-width="1"/>
  <text x="540" y="26" font-family="monospace" font-size="8" fill="#3b82f6" text-anchor="middle">🔔</text>
  <!-- stats row -->
  <rect x="165" y="56" width="95" height="62" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="212" y="74" font-family="monospace" font-size="6.5" fill="#6b7fa0" text-anchor="middle">TODAY'S VISITS</text>
  <text x="212" y="100" font-family="sans-serif" font-size="22" fill="#3b82f6" text-anchor="middle" font-weight="bold">42</text>
  <rect x="270" y="56" width="95" height="62" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="317" y="74" font-family="monospace" font-size="6.5" fill="#6b7fa0" text-anchor="middle">PENDING</text>
  <text x="317" y="100" font-family="sans-serif" font-size="22" fill="#fbbf24" text-anchor="middle" font-weight="bold">8</text>
  <rect x="375" y="56" width="95" height="62" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="422" y="74" font-family="monospace" font-size="6.5" fill="#6b7fa0" text-anchor="middle">CRITICAL</text>
  <text x="422" y="100" font-family="sans-serif" font-size="22" fill="#f43f8e" text-anchor="middle" font-weight="bold">3</text>
  <rect x="480" y="56" width="112" height="62" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="536" y="74" font-family="monospace" font-size="6.5" fill="#6b7fa0" text-anchor="middle">DISCHARGED</text>
  <text x="536" y="100" font-family="sans-serif" font-size="22" fill="#0ff4c6" text-anchor="middle" font-weight="bold">19</text>
  <!-- patient cards -->
  <rect x="165" y="130" width="270" height="195" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="180" y="150" font-family="monospace" font-size="8" fill="#3b82f6">APPOINTMENTS TODAY</text>
  <!-- appt items -->
  <rect x="175" y="158" width="250" height="38" rx="6" fill="#051826"/>
  <circle cx="193" cy="177" r="10" fill="#3b82f6" opacity="0.4"/>
  <text x="193" y="181" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">AK</text>
  <text x="210" y="171" font-family="sans-serif" font-size="8.5" fill="#e8edf5">Ayesha Khan</text>
  <text x="210" y="184" font-family="monospace" font-size="6.5" fill="#6b7fa0">09:00  ·  Cardiology</text>
  <rect x="380" y="163" width="40" height="14" rx="7" fill="#0ff4c6" opacity="0.15" stroke="#0ff4c6" stroke-width="0.7"/>
  <text x="400" y="173" font-family="monospace" font-size="6" fill="#0ff4c6" text-anchor="middle">Confirmed</text>
  <rect x="175" y="202" width="250" height="38" rx="6" fill="#051826"/>
  <circle cx="193" cy="221" r="10" fill="#f43f8e" opacity="0.4"/>
  <text x="193" y="225" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">NP</text>
  <text x="210" y="215" font-family="sans-serif" font-size="8.5" fill="#e8edf5">Nimal Perera</text>
  <text x="210" y="228" font-family="monospace" font-size="6.5" fill="#6b7fa0">10:30  ·  Neurology</text>
  <rect x="380" y="207" width="40" height="14" rx="7" fill="#fbbf24" opacity="0.15" stroke="#fbbf24" stroke-width="0.7"/>
  <text x="400" y="217" font-family="monospace" font-size="6" fill="#fbbf24" text-anchor="middle">Waiting</text>
  <rect x="175" y="246" width="250" height="38" rx="6" fill="#051826"/>
  <circle cx="193" cy="265" r="10" fill="#0ff4c6" opacity="0.4"/>
  <text x="193" y="269" font-family="sans-serif" font-size="7" fill="white" text-anchor="middle">AS</text>
  <text x="210" y="259" font-family="sans-serif" font-size="8.5" fill="#e8edf5">Amara Silva</text>
  <text x="210" y="272" font-family="monospace" font-size="6.5" fill="#6b7fa0">11:15  ·  Pediatrics</text>
  <rect x="380" y="251" width="40" height="14" rx="7" fill="#0ff4c6" opacity="0.15" stroke="#0ff4c6" stroke-width="0.7"/>
  <text x="400" y="261" font-family="monospace" font-size="6" fill="#0ff4c6" text-anchor="middle">Confirmed</text>
  <!-- right panel: health vitals -->
  <rect x="446" y="130" width="146" height="195" rx="8" fill="#030e1d" stroke="#0d2340" stroke-width="1"/>
  <text x="519" y="150" font-family="monospace" font-size="7.5" fill="#3b82f6" text-anchor="middle">PATIENT VITALS</text>
  <text x="519" y="166" font-family="monospace" font-size="6.5" fill="#6b7fa0" text-anchor="middle">Nimal Perera</text>
  <!-- heart rate -->
  <text x="462" y="186" font-family="monospace" font-size="6.5" fill="#6b7fa0">Heart Rate</text>
  <text x="462" y="202" font-family="sans-serif" font-size="16" fill="#f43f8e" font-weight="bold">78 bpm</text>
  <path d="M 462,215 L 470,215 L 475,205 L 480,228 L 485,208 L 490,215 L 580,215" stroke="#f43f8e" stroke-width="1.5" fill="none" opacity="0.7"/>
  <!-- bp -->
  <text x="462" y="244" font-family="monospace" font-size="6.5" fill="#6b7fa0">Blood Pressure</text>
  <text x="462" y="260" font-family="sans-serif" font-size="16" fill="#3b82f6" font-weight="bold">120/80</text>
  <!-- spo2 -->
  <text x="462" y="284" font-family="monospace" font-size="6.5" fill="#6b7fa0">SpO₂</text>
  <text x="462" y="300" font-family="sans-serif" font-size="16" fill="#0ff4c6" font-weight="bold">98%</text>
  <circle cx="528" cy="296" r="12" stroke="#0ff4c6" stroke-width="1.5" fill="none" opacity="0.5"/>
  <text x="528" y="300" font-family="monospace" font-size="8" fill="#0ff4c6" text-anchor="middle">✓</text>
</svg>
