  <ellipse cx="498" cy="171" rx="28" ry="11" fill="#062e20" transform="rotate(-18,498,171)"/>
  <ellipse cx="525" cy="176" rx="26" ry="9" fill="#083526" transform="rotate(12,525,176)"/>
