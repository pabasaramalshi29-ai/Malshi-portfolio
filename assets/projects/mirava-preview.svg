  <text x="380" y="26" font-family="monospace" font-size="8" fill="white" opacity="0.7" letter-spacing="2">ROOMS</text>
  <text x="440" y="26" font-family="monospace" font-size="8" fill="white" opacity="0.7" letter-spacing="2">SPA</text>
