  <rect x="200" y="275" width="160" height="52" rx="8" fill="black" opacity="0.6" stroke="#ffffff14" stroke-width="1"/>
  <rect x="380" y="275" width="200" height="52" rx="8" fill="black" opacity="0.6" stroke="#ffffff14" stroke-width="1"/>
  <text x="100" y="296" font-family="monospace" font-size="7" fill="#0ff4c6" text-anchor="middle">OCEAN VILLA</text>
  <text x="100" y="310" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">$320 / night</text>
  <text x="280" y="296" font-family="monospace" font-size="7" fill="#0ff4c6" text-anchor="middle">JUNGLE SUITE</text>
  <text x="280" y="310" font-family="sans-serif" font-size="10" fill="white" text-anchor="middle">$245 / night</text>
  <text x="480" y="296" font-family="monospace" font-size="7" fill="#fbbf24" text-anchor="middle">★ 4.9 · BEST SELLER</text>
