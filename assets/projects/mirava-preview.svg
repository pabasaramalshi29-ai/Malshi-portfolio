<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="600" height="340">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#041f1a"/>
      <stop offset="60%" style="stop-color:#062e28"/>
      <stop offset="100%" style="stop-color:#051a16"/>
    </linearGradient>
    <linearGradient id="water" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#062e28;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#041f1a"/>
    </linearGradient>
    <linearGradient id="sun" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:0.9"/>
      <stop offset="100%" style="stop-color:#f97316;stop-opacity:0"/>
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#sky)"/>
  <!-- sun/moon glow -->
  <circle cx="480" cy="85" r="55" fill="#fbbf24" opacity="0.07"/>
  <circle cx="480" cy="85" r="32" fill="#fbbf24" opacity="0.14"/>
  <circle cx="480" cy="85" r="18" fill="#fbbf24" opacity="0.65"/>
  <!-- stars -->
  <circle cx="80" cy="30" r="1.2" fill="white" opacity="0.6"/>
  <circle cx="150" cy="18" r="1" fill="white" opacity="0.5"/>
  <circle cx="220" cy="45" r="1.5" fill="white" opacity="0.7"/>
