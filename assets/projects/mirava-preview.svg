  <text x="300" y="130" font-family="Georgia,serif" font-size="11" fill="#0ff4c6" text-anchor="middle" letter-spacing="6">MIRAVA RESORT</text>
  <text x="300" y="158" font-family="Georgia,serif" font-size="22" fill="white" text-anchor="middle" font-style="italic">Your Perfect</text>
